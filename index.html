<style>

<script>
const $=id=>document.getElementById(id),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),P=a=>a[R(0,a.length-1)],sh=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const fm=v=>typeof v=='number'?String(+v.toFixed(2)):v,D=Math.PI/180,sci=x=>{const p=Math.floor(Math.log10(x));return (x/10**p).toFixed(2)+'×10^'+p};
/* ---------- lesson data ---------- */
const T=[
['vec','Vectors and relative velocity','vec',['A vector has magnitude and direction; resolve it into x and y components.','Resultant of perpendicular vectors: √(A²+B²), direction tanθ = B/A.','Relative velocity of B with respect to A: v(BA) = vB − vA (vector subtraction).','Same direction: |vB − vA|. Opposite directions: vA + vB. Perpendicular: √(vA²+vB²).','Ferry crossing a river: aim upstream to land directly opposite.'],['vx = v cosθ , vy = v sinθ','v(AB) = vA − vB (vectors)']],
['proj','Projectile motion','proj',['Horizontal motion: constant velocity, zero acceleration.','Vertical motion: acceleration g downward, independent of horizontal speed.','Horizontal projectile: time depends only on height, so a faster launch gives the same time but a bigger range.','Angled launch: at the top vy = 0, speed = v cosθ. Same speed gives the same range at θ and 90° − θ; maximum range at 45°.','Doubling v0 sinθ doubles flight time and quadruples maximum height.'],['Horizontal: t = √(2h/g) , R = v t','Angled: H = v²sin²θ/2g , T = 2v sinθ/g , R = v²sin2θ/g']],
['tq','Torque and equilibrium','tq',['Moment (torque) measures the turning effect of a force about a pivot.','Only the component perpendicular to the arm turns the body: M = F d sinθ.','Anticlockwise moments are positive, clockwise negative.','Translational equilibrium: ΣF = 0; resolve into ΣFx = 0 and ΣFy = 0.','Hanging lamp on two equal cables: horizontal components cancel; vertical components add up to the weight.'],['M = F d sinθ (N·m)','2T sinθ = mg (θ from horizontal)']],
['mom','Momentum, impulse and collisions','mom',['Momentum p = mv is a vector; impulse J = FΔt = Δp.','Same Δp with longer time means a smaller average force (airbags, cushions).','Area under a force–time graph equals impulse.','Isolated system: total momentum is conserved (explosions, recoil, collisions).','Inelastic: momentum conserved, kinetic energy decreases; perfectly inelastic: bodies stick together.'],['m1v1 + m2v2 = m1v1′ + m2v2′','e = (v2′ − v1′)/(v1 − v2)']],
['circ','Circular motion','circ',['Uniform circular motion: constant speed, but velocity direction changes, so there is acceleration towards the centre.','There is no outward “centrifugal force” acting on the body; the net force points to the centre.','If the string breaks the body flies off along the tangent.','Vertical circle: tension is greatest at the bottom and smallest at the top; minimum top speed (T = 0) is √(gr).','Conical pendulum: horizontal component of tension provides the centripetal force.'],['ac = v²/r = ω²r , Fc = mv²/r','v = 2πr/T , ω = 2π/T']],
['grav','Kepler’s laws and gravitation','grav',['1st law: orbits are ellipses with the Sun at one focus.','2nd law: equal areas in equal times, so a planet is fastest at the nearest point (conservation of angular momentum).','3rd law: T² ∝ r³ for bodies orbiting the same central body.','Gravitational force between masses: inversely proportional to r².','A geostationary satellite has T = 24 h, equatorial orbit.'],['F = G m1 m2 / r²','T²/r³ = constant , g = GM/r²']],
['shm','Simple harmonic motion and pendulums','wave',['Restoring force is proportional to displacement and opposite to it: F = −kx.','At maximum displacement: speed zero, force and acceleration maximum. At equilibrium: speed maximum, acceleration zero.','Spring period depends on m and k only; not on amplitude or g.','Simple pendulum (small angles): depends on L and g, not on mass or amplitude.','Quadruple the mass: period doubles. Quadruple the length: period doubles.'],['T = 2π√(m/k)','T = 2π√(L/g) , f = 1/T']],
['wav','Waves and interference','wave',['Mechanical waves carry energy, not matter. Transverse vs longitudinal.','v = fλ; speed depends on the medium, frequency on the source.','Coherent in-phase sources: constructive when path difference = mλ, destructive when = (m + ½)λ.','Standing wave: nodes (zero displacement) and antinodes, spaced λ/2.','Opposite-phase sources swap the positions of constructive and destructive interference.'],['v = f λ','Δd = mλ (bright) , (m + ½)λ (dark)']],
['dop','Doppler effect','wave',['Relative motion between source and observer changes the observed frequency.','Approaching: frequency rises (shorter wavelength). Receding: frequency falls.','The speed of sound in air does not change.','Light: red shift means receding, blue shift means approaching.','The speed of light stays c for all observers.'],['f′ = f·v/(v − vs) (source approaching)','Δλ/λ = v/c']],
['opt','Refraction and total internal reflection','refr',['Entering a denser medium: speed and wavelength decrease, frequency unchanged, ray bends towards the normal.','n = c/v and Snell’s law: n1 sinθ1 = n2 sinθ2.','Total internal reflection: denser to rarer medium with incidence angle above the critical angle.','Optical fibre: core index larger than cladding index.','Larger n means a smaller critical angle.'],['n = c/v = λ0/λ','sinθc = n2/n1 (n1 > n2)']],
['len','Lenses and Young’s experiment','lens',['Convex lens converges; concave lens always gives virtual, upright, diminished images.','Object beyond 2F gives a real, inverted, diminished image; between F and 2F real, inverted, magnified; inside F virtual, upright, magnified.','Young’s experiment: bright fringes where Δd = mλ; the central fringe is always bright (zero path difference).','Fringe spacing grows with λ and screen distance, shrinks with slit separation.'],['1/f = 1/u + 1/v , M = v/u','Δy = λR/d']]];
const TN=Object.fromEntries(T.map(t=>[t[0],t[1]]));
/* ---------- diagrams ---------- */
const ar=(x1,y1,x2,y2,c='a')=>{const t=Math.atan2(y2-y1,x2-x1),h=(d)=>`${x2-9*Math.cos(t+d)},${y2-9*Math.sin(t+d)}`;return `<path class="${c}" d="M${x1} ${y1}L${x2} ${y2}"/><path class="${c}" d="M${h(.4)}L${x2} ${y2}L${h(-.4)}"/>`};
const tx=(x,y,s)=>`<text x="${x}" y="${y}">${s}</text>`;
const DG={vec:()=>`<path class="s" d="M20 105H225M30 112V8"/>${ar(30,105,150,35)}<path class="b" d="M30 105H150V35"/>${tx(75,60,'v')}${tx(70,118,'vx = v cosθ')}${tx(155,75,'vy = v sinθ')}${tx(52,98,'θ')}`,
proj:()=>`<path class="s" d="M10 105H230"/><path class="a" d="M20 105Q110 -15 200 105"/><path class="b" d="M110 105V45"/>${ar(20,105,48,70,'s')}${tx(114,80,'H')}${tx(100,118,'R')}${tx(30,70,'v0')}`,
tq:()=>`<path class="s" d="M40 70H200" style="stroke-width:6"/><path class="s" d="M40 70L30 95H50Z"/>${ar(200,70,200,22)}${tx(205,40,'F')}${tx(110,88,'d')}${tx(60,20,'M = F·d·sinθ')}`,
mom:()=>`<circle class="s" cx="60" cy="60" r="16"/><circle class="s" cx="180" cy="60" r="16"/>${ar(80,60,115,60)}${ar(160,60,125,60,'b')}${tx(35,95,'p = mv')}${tx(60,20,'J = FΔt = Δp')}`,
circ:()=>`<circle class="s" cx="120" cy="60" r="45"/><circle cx="165" cy="60" r="5" fill="currentColor" style="color:var(--ac)"/>${ar(165,60,165,18)}${ar(165,60,128,60,'b')}${tx(170,30,'v')}${tx(135,50,'ac')}${tx(100,64,'centre')}`,
wave:()=>{let p='M10 60';for(let x=10;x<=230;x+=4)p+=`L${x} ${60-35*Math.sin((x-10)/220*Math.PI*4)}`;return `<path class="s" d="M10 60H230"/><path class="a" d="${p}"/><path class="b" d="M10 112H120"/>${tx(55,108,'λ')}${tx(12,22,'A')}`},
refr:()=>`<path class="s" d="M10 60H230"/><path class="b" d="M120 5V115"/>${ar(60,10,120,60)}${ar(120,60,150,112)}${tx(150,25,'n1 (rarer)')}${tx(150,90,'n2 (denser)')}${tx(95,45,'θ1')}${tx(125,80,'θ2')}`,
lens:()=>`<path class="s" d="M10 60H230"/><path class="s" d="M120 12Q138 60 120 108Q102 60 120 12"/>${ar(50,60,50,30,'s')}<path class="a" d="M50 30H120L190 90"/><path class="a" d="M50 30L190 90"/>${ar(190,60,190,90,'s')}${tx(83,74,'F')}${tx(153,74,'F′')}`,
grav:()=>`<ellipse class="s" cx="120" cy="60" rx="95" ry="45"/><circle cx="198" cy="60" r="7" fill="currentColor" style="color:var(--ac2)"/>${tx(180,82,'Sun')}${tx(40,30,'planet: fastest near Sun')}`};
Object.assign(DG,{
vec2:()=>`<path class="s" d="M20 108H225M30 115V8"/>${ar(30,108,140,25)}<path class="b" d="M30 108H140V25"/>${tx(34,40,'v = 10 m/s')}${tx(52,102,'37°')}`,
proj2:()=>`<path class="s" d="M10 108H230"/><path class="a" d="M20 108Q110 56 200 108"/><circle cx="110" cy="82" r="4" fill="currentColor" style="color:var(--ac2)"/>${tx(116,78,'P (highest point)')}${tx(26,80,'v0 = 20 m/s')}${tx(45,104,'30°')}`,
fbd:()=>`<path class="s" d="M10 15H230" style="stroke-width:5"/><path class="a" d="M42 15L120 60L198 15"/><circle class="s" cx="120" cy="72" r="12"/>${ar(120,84,120,118,'b')}${tx(128,112,'W = 40 N')}${tx(46,40,'30°')}${tx(176,40,'30°')}${tx(88,30,'T')}${tx(146,30,'T')}`,
ft:()=>`<path class="s" d="M30 105H225M30 112V8"/><path class="a" d="M30 105L110 25L190 105Z"/>${tx(4,14,'F (N)')}${tx(205,100,'t (s)')}${tx(116,24,'40 N')}${tx(176,119,'0.5 s')}`,
vc:()=>`<circle class="s" cx="120" cy="62" r="40"/><circle cx="120" cy="22" r="5" fill="currentColor" style="color:var(--ac)"/>${ar(114,26,114,52)}${ar(126,26,126,52,'b')}${tx(96,44,'T')}${tx(131,44,'mg')}${tx(135,16,'top point')}${tx(124,70,'centre')}`,
kep2:()=>`<ellipse class="s" cx="110" cy="60" rx="95" ry="45"/><circle cx="194" cy="60" r="6" fill="currentColor" style="color:var(--ac2)"/>${tx(168,82,'Sun')}${tx(210,52,'A')}${tx(2,52,'B')}${tx(113,11,'C')}${tx(113,122,'D')}`,
xt:()=>{let p='M30 62';for(let x=30;x<=190;x+=4)p+=`L${x} ${62-40*Math.sin((x-30)/160*2*Math.PI)}`;return `<path class="s" d="M20 62H230M30 112V8"/><path class="a" d="${p}"/>${tx(2,26,'5 cm')}${tx(172,78,'0.4 s')}${tx(36,12,'x')}${tx(216,56,'t')}`},
wav2:()=>`<path class="a" d="M35 30L205 65"/><path class="b" d="M35 100L205 65"/>${tx(12,28,'S1')}${tx(12,106,'S2')}${tx(212,68,'P')}${tx(80,32,'S1P = 12 cm')}${tx(70,110,'S2P = 15 cm')}`,
dop2:()=>`${[[125,12],[110,24],[95,36],[80,48]].map(c=>`<circle class="a" cx="${c[0]}" cy="60" r="${c[1]}"/>`).join('')}<circle cx="140" cy="60" r="4" fill="currentColor" style="color:var(--ac2)"/>${ar(146,60,180,60,'b')}${tx(203,52,'A')}${tx(6,52,'B')}${tx(156,52,'v')}`,
tir:()=>`<path class="s" d="M10 60H230"/><path class="b" d="M120 8V115"/>${ar(70,102,120,60)}${ar(120,60,170,102)}${tx(12,22,'air (n = 1)')}${tx(12,120,'glass (n = 1.5)')}${tx(96,92,'50°')}${tx(130,28,'θc = 42°')}`,
lens2:()=>`<path class="s" d="M10 60H230"/><path class="s" d="M120 12Q138 60 120 108Q102 60 120 12"/>${ar(75,60,75,40,'s')}<path class="s" d="M60 55V65M90 55V65M150 55V65M180 55V65"/>${tx(53,78,'2F')}${tx(86,78,'F')}${tx(145,78,'F′')}${tx(172,78,'2F′')}${tx(50,32,'object')}`});
const qd=k=>k?`<div class="qd">${dg(k)}</div>`:'';
const dg=k=>`<svg viewBox="0 0 240 125" role="img" aria-label="Diagram">${(DG[k]||DG.wave)()}</svg>`;
/* ---------- question bank ---------- */
const S=[],G=[];
const sq=([t,d,q,os,a,e,w,g])=>({t,d,q,e,g,o:sh(os.map((s,i)=>({s,ok:i==a,r:w})))});
[['vec',1,'Two cars move in opposite directions at 30 m/s and 20 m/s. What is the speed of the first relative to the second?',['10 m/s','20 m/s','50 m/s','600 m/s'],2,'For opposite directions the speeds add: 30 + 20 = 50 m/s.','Subtraction is for the same direction, and speeds are never multiplied.'],
['vec',2,'A is faster than B and both move in the same direction. How does A appear from B?',['Same direction, speed vA − vB','Opposite direction, speed vA − vB','Same direction, speed vA + vB','Opposite direction, speed vA + vB'],0,'Relative velocity is the difference, and A still gets ahead of B, so it moves forward at vA − vB.','Check direction (A is ahead of B) and whether you subtract or add.'],
['proj',1,'The horizontal motion of a horizontal projectile has…',['constant acceleration g','constant speed','increasing acceleration','zero speed'],1,'No horizontal force (ignoring air resistance), so horizontal velocity stays constant.','Gravity acts vertically only.'],
['proj',2,'A horizontal projectile’s launch speed is doubled from the same height. Its time of flight…',['halves','doubles','is unchanged','quadruples'],2,'t = √(2h/g) depends only on height.','Horizontal speed affects range, not fall time.'],
['proj',2,'Which launch angle gives the greatest range on level ground (same speed)?',['30°','45°','60°','90°'],1,'R = v²sin2θ/g is maximum when sin2θ = 1, so θ = 45°.','Test sin2θ: only 45° gives sin90° = 1.'],
['proj',3,'At the top of its flight a projectile launched at an angle has a speed equal to…',['zero','the vertical component of v0','the horizontal component of v0','v0'],2,'vy = 0 at the top but vx = v0 cosθ never changes.','Only the vertical component becomes zero.'],
['tq',1,'The SI unit of the moment of a force is…',['N','J','N·m','m/s'],2,'M = F × d, so the unit is newton·metre.','Joule has the same dimensions, but a moment is not energy; the unit used is N·m.'],
['tq',2,'The perpendicular distance is doubled and the force is constant. The moment…',['halves','doubles','is unchanged','quarters'],1,'M = Fd is directly proportional to d.','Moment grows with the arm, it does not shrink.'],
['mom',1,'An airbag lengthens the stopping time to 3Δt with the same Δp. The average force becomes…',['3 times','half','one third','unchanged'],2,'F = Δp/Δt, so tripling time divides force by 3.','Force and time are inversely proportional for a fixed Δp.'],
['mom',2,'In an inelastic collision in an isolated system…',['momentum and KE are both conserved','momentum is conserved, KE decreases','momentum not conserved, KE conserved','both decrease'],1,'No external impulse keeps momentum; KE converts to heat, sound and deformation.','Momentum is always conserved when no external force acts.'],
['circ',1,'In uniform circular motion the acceleration…',['is zero because speed is constant','points towards the centre','points outwards','points along the velocity'],1,'The velocity direction changes continuously, requiring an inward acceleration v²/r.','Changing direction is acceleration even at constant speed.'],
['circ',3,'Minimum speed at the top of a vertical circle of radius r (tension just zero)?',['√(2gr)','√(gr)','gr','√(g/r)'],1,'With T = 0, mg = mv²/r, so v = √(gr).','Set weight equal to the centripetal force.'],
['grav',1,'Kepler’s first law places the Sun…',['at the centre of the orbit','at one focus of the ellipse','outside the ellipse','at the middle of the minor axis'],1,'Planetary orbits are ellipses with the Sun at one focus.','The ellipse has two foci and the Sun is at one of them.'],
['grav',2,'A comet moves fastest when it is…',['farthest from the Sun','nearest to the Sun','halfway','its speed is constant'],1,'Equal areas in equal times (angular momentum conserved) means higher speed at small r.','A smaller r requires a faster speed to sweep the same area.'],
['shm',1,'At maximum displacement in SHM the speed is…',['maximum','zero','constant','equal to the acceleration'],1,'The body momentarily stops and turns back; force and acceleration are maximum there.','Speed is maximum at equilibrium, not at the extremes.'],
['shm',2,'A spring pendulum’s mass is multiplied by 4. The period becomes…',['T/2','2T','4T','16T'],1,'T ∝ √m, so √4 = 2.','Period depends on the square root of the mass.'],
['shm',2,'The period of a small-angle simple pendulum depends on…',['mass and amplitude','length and g','mass and length','amplitude and mass'],1,'T = 2π√(L/g).','Mass and amplitude do not appear in the formula.'],
['wav',1,'A mechanical wave transfers…',['matter','energy','particles of the medium','total displacement'],1,'Particles only oscillate; the wave carries energy.','Particles do not travel along with the wave.'],

function mk(t,d,q,c,w,e,u=''){const o=[{s:fm(c)+u,ok:1}],seen=new Set([o[0].s]);w.forEach(([v,r])=>{const s=fm(v)+u;if(!seen.has(s)&&o.length<4){seen.add(s);o.push({s,r})}});let k=0;while(o.length<4){const s=fm(typeof c=='number'?c*[1.5,2,.5,3,4][k++]:c+k++)+u;if(!seen.has(s)){seen.add(s);o.push({s,r:'A plausible slip, but it does not follow from the formula.'})}}return{t,d,q,e,o:sh(o)}}

g('wav',2,()=>{const l=P([2,4,6]),k=P([1,1.5,2,2.5,3,3.5]),c=Number.isInteger(k);return mk('wav',2,`Two coherent in-phase sources emit waves of wavelength ${l} cm. At point P the path difference is ${l*k} cm. What happens at P?`,c?'Constructive interference':'Destructive interference',[[c?'Destructive interference':'Constructive interference','Whole number of λ → constructive; odd multiple of λ/2 → destructive.'],['Partial interference with amplitude A','Only exact multiples of λ/2 give maximum or zero.'],['No interference occurs','Coherent sources always interfere.']],`Δd/λ = ${l*k}/${l} = ${k} → ${c?'a whole number, so constructive':'a half-odd number, so destructive'}.`)});
g('dop',2,()=>{const f=P([500,600,800]),s=P([20,34,68]),r=f*340/(340-s);return mk('dop',2,`A source emitting ${f} Hz approaches a stationary observer at ${s} m/s (speed of sound 340 m/s). Observed frequency?`,r,[[f*340/(340+s),'That is the receding case.'],[f,'Relative motion changes the frequency.'],[f*(340-s)/340,'The ratio is inverted.']],`f′ = f·v/(v − vs) = ${f}×340/${340-s} = ${fm(r)} Hz.`,' Hz')});
g('dop',3,()=>{const z=P([.01,.02,.05]),v=3e8*z/1e6;return mk('dop',3,`A galaxy’s spectral line is red-shifted by Δλ/λ = ${z}. Its recession speed (c = 3×10⁸ m/s)?`,v,[[v*10,'Power-of-ten slip.'],[v/2,'v = c·Δλ/λ has no factor ½.'],[300+v,'You added c; the formula multiplies.']],`v = c Δλ/λ = 3×10⁸ × ${z} = ${v}×10⁶ m/s.`,'×10⁶ m/s')});
g('opt',1,()=>{const v=P([1.5,2,2.25,2.5]),n=3/v;return mk('opt',1,`Light travels at ${v}×10⁸ m/s in a glass. Its refractive index (c = 3×10⁸ m/s)?`,n,[[v/3,'n = c/v, not v/c.'],[3*v,'n is a ratio, not a product.'],[3-v,'n is a ratio, not a difference.']],`n = c/v = 3/${v} = ${fm(n)}.`)});
g('opt',2,()=>{const n=P([1.33,1.5,2,2.4]),c=+(Math.asin(1/n)/D).toFixed(1);return mk('opt',2,`Critical angle for a medium of refractive index ${n} against air?`,c,[[+(Math.acos(1/n)/D).toFixed(1),'sinθc = n2/n1, not cosθc.'],[+(90-c).toFixed(1),'You subtracted from 90°.'],[+(Math.atan(1/n)/D).toFixed(1),'tanθc is not used.']],`sinθc = 1/${n} → θc = ${c}°.`,'°')});
g('opt',3,()=>{const n=P([1.33,1.5,2]),a=P([30,45,60]),b=+(Math.asin(Math.sin(a*D)/n)/D).toFixed(1);return mk('opt',3,`A ray in air hits a medium of index ${n} at ${a}°. Angle of refraction?`,b,[[+(a/n).toFixed(1),'Snell’s law relates sines, not angles.'],[+(90-b).toFixed(1),'You gave the angle with the surface.'],[a,'The ray bends towards the normal in a denser medium.']],`sinθ2 = sin${a}°/${n} → θ2 = ${b}°.`,'°')});
g('len',2,()=>{const f=P([10,12,15,20]),u=f*P([1.5,2,3,4]),v=u*f/(u-f);return mk('len',2,`An object is ${u} cm from a convex lens of focal length ${f} cm. Image distance?`,v,[[u-f,'Use 1/f = 1/u + 1/v, not subtraction of distances.'],[u*f/(u+f),'Sign error: 1/v = 1/f − 1/u.'],[u+f,'Distances are not added.']],`1/v = 1/${f} − 1/${u} → v = ${fm(v)} cm.`,' cm')});
g('len',2,()=>{const l=P([450,500,600]),Rr=P([1,1.5,2,3]),d=P([.2,.3,.5]),y=l*1e-9*Rr/(d*1e-3)*1e3;return mk('len',2,`Young’s experiment: λ = ${l} nm, slit separation ${d} mm, screen ${Rr} m away. Fringe spacing in mm?`,y,[[y*10,'Unit slip: check nm → m and mm → m.'],[y/10,'Unit slip: check nm → m and mm → m.'],[y*2,'Δy = λR/d with no extra factors.']],`Δy = λR/d = ${l}×10⁻⁹×${Rr}/(${d}×10⁻³) = ${fm(y)} mm.`,' mm')});
/* ---------- generation ---------- */
function gen(tops,d,n,dq=0){let out=[],seen=new Set,tr=0;const st=sh(S.filter(x=>tops.includes(x[0])&&(!d||x[1]==d)&&(dq==1?x[7]:dq==2?!x[7]:1))),gs=dq==1?[]:G.filter(x=>tops.includes(x.t)&&(!d||x.d==d));
 while(out.length<n&&tr++<500){let q=(st.length&&(!gs.length||Math.random()<.3))?sq(st.pop()):gs.length?P(gs).f():null;if(!q)break;if(seen.has(q.q))continue;seen.add(q.q);out.push(q)}
 if(out.length<n&&d)out=out.concat(gen(tops,0,n-out.length,dq).filter(q=>!seen.has(q.q)));return out}

const E={
vec:[['Explain, with a vector diagram, how to find the velocity of B relative to A when they move at right angles.','Draw vA and vB from a common point; v(BA) = vB − vA is the vector from the tip of vA to the tip of vB. Magnitude √(vA² + vB²), direction tanθ = vB/vA.'],['A boat must cross a river and land directly opposite. Explain how the pilot should steer and why.','Aim upstream so that the upstream component of the boat’s velocity cancels the current: vboat sinα = vcurrent. The resultant is then perpendicular to the bank.']],
proj:[['Prove that R = v²sin2θ/g for a projectile on level ground and state the angle of maximum range.','Vertical: 0 = v sinθ·T − ½gT², so T = 2v sinθ/g. Horizontal: R = v cosθ·T = v²·2sinθcosθ/g = v²sin2θ/g. Maximum when sin2θ = 1, so θ = 45°.'],['Why do a dropped ball and a horizontally fired ball reach the ground together?','Vertical motion depends only on g and the height (t = √(2h/g)). Horizontal velocity is constant and independent; it only increases the range.']],
tq:[['State the conditions for equilibrium and use them to find the tension in the two cables holding a lamp.','ΣF = 0 and Σ moments = 0. Horizontal components cancel; vertically 2T sinθ = mg, so T = mg/(2 sinθ).'],['Define the moment of a force and explain why the line of action matters.','Moment = F × perpendicular distance from the pivot (M = Fd sinθ). A force through the pivot has d = 0 and no turning effect; only the perpendicular component turns the body.']],
mom:[['Use Newton’s third law to show that momentum is conserved in a collision.','During contact the forces are equal and opposite for the same time, so the impulses cancel: Δp1 = −Δp2. Total momentum of an isolated system is unchanged.'],['Explain how airbags and crumple zones reduce injury.','The impulse FΔt = Δp is fixed by the stop; lengthening the stopping time reduces the average force on the passenger.']],
circ:[['Explain why a body moving in a circle at constant speed is accelerating, and give the direction of the force.','The velocity changes direction, so there is an acceleration ac = v²/r towards the centre. The net force Fc = mv²/r also points to the centre.'],['Derive the minimum speed at the top of a vertical circle and compare the tension at the top and bottom.','Top, T = 0: mg = mv²/r, so v = √(gr). Bottom: T − mg = mv²/r; top: T + mg = mv²/r. Tension is greatest at the bottom.']],
grav:[['State Kepler’s three laws and explain the second using angular momentum.','1: elliptical orbits, Sun at one focus. 2: equal areas in equal times; since mvr is constant, v is larger when r is smaller. 3: T²/r³ is constant.'],['Explain what makes a satellite geostationary.','It orbits in the equatorial plane, in the direction of Earth’s spin, with a period of 24 h, so it stays above one point. Its radius follows from T² ∝ r³.']],
shm:[['Describe the motion of a mass on a spring through one cycle (displacement, speed, acceleration).','At the extremes: speed zero, acceleration and restoring force maximum. At equilibrium: speed maximum, acceleration zero. T = 2π√(m/k) is independent of amplitude.'],['Explain why the period of a simple pendulum does not depend on its mass.','The restoring force component mg sinθ is proportional to m, so m cancels in a = g sinθ; T = 2π√(L/g).']],
wav:[['Explain how a standing wave forms and where the nodes and antinodes occur.','Two identical waves travelling in opposite directions superpose. Nodes (zero) occur where they cancel, antinodes (maximum) where they reinforce; both are spaced λ/2 apart.'],['Two coherent sources are in phase. State the conditions for bright and dark points, and what changes if they are in antiphase.','Bright: Δd = mλ. Dark: Δd = (m + ½)λ. For antiphase sources the two conditions swap.']],
dop:[['Explain the Doppler effect for a moving ambulance siren.','Approaching: wavefronts are compressed, λ is shorter and f′ = fv/(v − vs) is higher. Receding: λ is longer and f is lower. The source’s own frequency and the speed of sound do not change.'],['How does red shift show that the universe is expanding?','Light from distant galaxies has a longer observed wavelength; Δλ/λ = v/c means the galaxies are receding, and more distant ones recede faster.']],
opt:[['Describe how total internal reflection happens and give two applications.','From a denser to a rarer medium the ray bends away from the normal; beyond θc no ray emerges and all light is reflected. Used in optical fibres and in prisms of binoculars.'],['Show that when light enters a denser medium its frequency is unchanged but its wavelength decreases.','Frequency is fixed by the source. v = c/n falls, and with v = fλ and f fixed, λ = λ0/n decreases.']],
len:[['Explain image formation by a convex lens for an object between F and 2F.','The ray parallel to the axis passes through F′ and the ray through the centre is undeviated. They meet beyond 2F, giving a real, inverted, magnified image.'],['Explain how Young’s experiment produces bright and dark fringes and what changes with wavelength.','Light from two coherent slits overlaps: bright where Δd = mλ, dark where Δd = (m + ½)λ. Fringe spacing Δy = λR/d grows with λ.']]};
Object.entries({
vec:[['Distinguish between scalar and vector quantities, giving three examples of each, and explain why speed and velocity are different.','Scalars have magnitude only (distance, speed, mass); vectors have magnitude and direction (displacement, velocity, force). Speed is the magnitude of velocity: a body moving round a circle at constant speed has a changing velocity.'],['Two ships leave a port, one sailing east at 12 m/s and one north at 16 m/s. Find the velocity of the second relative to the first, with its direction.','vB − vA = (−12, 16). Magnitude √(12² + 16²) = 20 m/s; tanθ = 16/12, so θ = 53° north of west.'],['The figure shows a velocity of 10 m/s at 37° to the horizontal. Find its horizontal and vertical components (sin37° = 0.6) and explain how the original vector is recovered from them.','vx = 10 cos37° = 8 m/s and vy = 10 sin37° = 6 m/s. They are the perpendicular sides of a right-angled triangle: √(8² + 6²) = 10 m/s and tanθ = 6/8, so θ = 37°.','vec2']],
proj:[['A stone is thrown horizontally from a cliff. Describe its horizontal and vertical motion and show that its path is a parabola.','Horizontal: x = vt (a = 0). Vertical: y = ½gt² (u = 0). Eliminating t gives y = gx²/2v², a parabola. The two motions are independent and share only the time.'],['Explain how the range and maximum height change when the launch speed is doubled at the same angle.','R ∝ v² and H ∝ v², so both become 4 times larger; the flight time T ∝ v doubles.'],['Use the figure (v0 = 20 m/s, 30°, g = 10 m/s²) to describe the velocity and acceleration at launch and at P, and find the time to reach P and the height of P.','Launch: vx = 17.3 m/s, vy = 10 m/s, a = g downward. At P: vy = 0, speed = 17.3 m/s horizontal, a still g downward. Time = vy/g = 1 s; height = v²sin²θ/2g = 5 m.','proj2'],()=>{const v=P([20,30,40]),th=P([30,60]),s=Math.sin(th*D);return [`A ball is launched at ${v} m/s, ${th}° above the horizontal on level ground (g = 10 m/s²). Find the time of flight, maximum height and range, and explain why the range is the same at ${90-th}°.`,`T = 2v sinθ/g = ${fm(2*v*s/10)} s; H = v²sin²θ/2g = ${fm(v*v*s*s/20)} m; R = v²sin2θ/g = ${fm(v*v*Math.sin(2*th*D)/10)} m. Since sin2θ = sin(180° − 2θ), θ and 90° − θ give equal ranges.`]}],
tq:[['Explain the difference between a couple and a single force in terms of their effect on a body.','A single force can translate and rotate a body; a couple (equal, opposite, parallel forces on different lines) gives rotation only because ΣF = 0. Its moment is F × the perpendicular distance between the forces.'],['A uniform 4 m plank weighing 200 N rests on supports 1 m from each end. Explain how to find the force at each support.','The weight acts at the centre, 1 m from each support. ΣF = 0: R1 + R2 = 200; moments about one support: R2 × 2 = 200 × 1. So each support carries 100 N.'],['The lamp in the figure weighs 40 N and hangs from two identical cables at 30° to the horizontal. Show that T = W/(2 sinθ), find T, and say what happens to T as θ gets smaller.','Horizontal components cancel; vertically 2T sinθ = W, so T = 40/(2×0.5) = 40 N. As θ decreases, sinθ decreases and T increases without limit.','fbd']],
mom:[['Compare elastic and inelastic collisions and state what is conserved in each.','Elastic: momentum and kinetic energy both conserved (e = 1). Inelastic: momentum conserved, KE decreases (e < 1). Perfectly inelastic: the bodies move together after impact.'],['Explain the recoil of a gun and find the recoil speed of a 4 kg rifle firing a 20 g bullet at 400 m/s.','Initial momentum is zero, so Mv + mu = 0. v = −(0.02 × 400)/4 = −2 m/s: the rifle recoils at 2 m/s opposite to the bullet.'],['The figure is the force–time graph of a 2 kg body during a 0.5 s impact. Find the impulse and the change in velocity, and explain how the graph changes for a longer, softer impact of the same impulse.','Impulse = area = ½ × 0.5 × 40 = 10 N·s; Δv = J/m = 5 m/s. A longer impact with the same area gives a lower, wider graph: the same Δp but a smaller average force.','ft'],()=>{const m1=P([2,3,4]),v1=R(4,10),m2=P([1,2]),v=m1*v1/(m1+m2),k0=.5*m1*v1*v1,k1=.5*(m1+m2)*v*v;return [`A ${m1} kg trolley moving at ${v1} m/s hits a ${m2} kg trolley at rest and they stick together. Find their common velocity and the kinetic energy lost, and say where the energy goes.`,`${m1}×${v1} = ${m1+m2}v′, so v′ = ${fm(v)} m/s. KE before = ${fm(k0)} J, after = ${fm(k1)} J, so ${fm(k0-k1)} J is lost as heat, sound and deformation (momentum is conserved, KE is not).`]}],
circ:[['A car takes a flat circular bend. Explain what provides the centripetal force and why a higher speed risks skidding.','Friction supplies Fc = mv²/r. Maximum friction is limited, so the safe speed satisfies μmg = mv²/r, v = √(μgr); above it the car skids outwards along the tangent.'],['Using v = ωr, compare the angular and linear speeds of two points at different radii on a turntable.','All points share the same ω and T. v = ωr and the centripetal acceleration ω²r are larger for the point at the larger radius.'],['The figure shows a ball on a string in a vertical circle. Write the equation of motion at the top and at the bottom and say where the string is most likely to break.','Top: T + mg = mv²/r. Bottom: T − mg = mv²/r. So T is larger at the bottom (where v is also greater): the string is most likely to break there.','vc']],
grav:[['Use Newton’s law of gravitation and circular motion to derive Kepler’s third law.','GMm/r² = mv²/r with v = 2πr/T gives GM/r² = 4π²r/T², so T²/r³ = 4π²/GM, a constant for one central body.'],['Explain why an astronaut in orbit feels weightless although gravity still acts.','Gravity supplies exactly the centripetal force, so astronaut and spacecraft fall together with the same acceleration. No contact force acts between them, so no weight is felt.'],['The figure shows an elliptical orbit with the Sun at one focus. State where the speed is greatest and least, justify it with angular momentum, and find vA/vB if the distance at B is 3 times that at A.','A (nearest) is fastest, B (farthest) slowest. Angular momentum mvr is constant, so v ∝ 1/r. If rB = 3rA then vA/vB = 3.','kep2']],
shm:[['Show that a mass on a spring performs SHM and derive its period.','F = −kx and F = ma give a = −(k/m)x, which is SHM with ω² = k/m. So T = 2π/ω = 2π√(m/k).'],['Describe the energy changes in one cycle of a simple harmonic oscillator.','At the extremes the energy is all potential (½kA²); at equilibrium it is all kinetic. The total is constant without friction, and it changes between the two forms twice per cycle.'],['The figure is the displacement–time graph of a mass on a spring. Read the amplitude, period and frequency, find the maximum speed (ω = 2πf) and state when the speed is zero.','A = 5 cm, T = 0.4 s, f = 2.5 Hz, ω = 15.7 rad/s. vmax = ωA = 0.79 m/s at t = 0, 0.2 s and 0.4 s (equilibrium); speed is zero at 0.1 s and 0.3 s (maximum displacement).','xt']],
wav:[['Distinguish between transverse and longitudinal waves with an example of each.','Transverse: particles vibrate perpendicular to the direction of travel (light, waves on a string). Longitudinal: particles vibrate along it, forming compressions and rarefactions (sound). Both transfer energy only.'],['Describe what happens to frequency, wavelength and speed when a wave passes from deep to shallow water.','Frequency is fixed by the source. The speed decreases in shallow water, so with v = fλ the wavelength decreases.'],['S1 and S2 are coherent in-phase sources. Using the figure, state the nature of P for λ = 3 cm and for λ = 2 cm, and for λ = 3 cm if the sources were in antiphase.','Δd = 15 − 12 = 3 cm. λ = 3 cm: Δd = 1λ, bright. λ = 2 cm: Δd = 1.5λ, dark. In antiphase the result swaps, so P is dark for λ = 3 cm.','wav2']],
dop:[['State two practical uses of the Doppler effect and explain the principle behind them.','Police speed radar and Doppler ultrasound of blood flow. Waves reflected from a moving object return with a shifted frequency, and the shift is proportional to its speed.'],['A moving source emits 600 Hz. Describe how the observed frequency changes as it passes a stationary observer.','It is above 600 Hz while approaching and below 600 Hz while receding, because the wavefronts are compressed in front and stretched behind. The source frequency and wave speed do not change.'],['The figure shows the wavefronts of a moving source. Explain why A and B detect different frequencies and calculate both for a 500 Hz source moving at 34 m/s (v = 340 m/s).','Wavefronts are compressed ahead of the source and stretched behind. A: f′ = 500×340/306 = 556 Hz. B: f′ = 500×340/374 = 455 Hz.','dop2']],
opt:[['Explain how an optical fibre carries light over long distances and why the core and cladding indices differ.','Light meets the core–cladding boundary above θc and is totally internally reflected again and again. This needs ncore > ncladding (dense to rare), so almost no light is lost.'],['Light passes from air into glass (n = 1.5) at 30° incidence. Find the angle of refraction and the speed of light in the glass.','sinθ2 = sin30°/1.5 = 0.333, so θ2 = 19.5°. v = c/n = 3×10⁸/1.5 = 2×10⁸ m/s.'],['The figure shows a ray in glass meeting an air boundary at 50°. Calculate θc for n = 1.5, explain what happens to the ray, and state what change lets it emerge.','sinθc = 1/1.5, θc = 41.8°. Since 50° > θc the ray is totally internally reflected. It emerges if the incidence angle is reduced below 41.8°.','tir']],
len:[['Explain why a concave lens cannot form a real image of a real object.','It diverges parallel rays, so they only appear to come from a point on the object’s side. The refracted rays never meet, so the image is always virtual, upright and diminished.'],['Describe how the fringes in Young’s experiment change when the screen is moved away and when the slits move closer together.','Δy = λR/d: a larger R widens the fringes in proportion, and a smaller d widens them too. The central fringe stays bright.'],['The figure shows an object 45 cm from a convex lens of focal length 30 cm. Describe the two-ray construction of the image, then find the image distance and magnification.','Ray 1 parallel to the axis passes through F′; ray 2 through the centre is undeviated; they meet beyond 2F′. 1/v = 1/30 − 1/45, so v = 90 cm and M = 2: real, inverted, magnified.','lens2'],()=>{const f=P([10,12,15]),u=f*P([1.5,2,3]),v=u*f/(u-f),m=v/u;return [`An object is ${u} cm from a convex lens of focal length ${f} cm. Calculate the image distance and the magnification and describe the image.`,`1/v = 1/${f} − 1/${u}, so v = ${fm(v)} cm. M = v/u = ${fm(m)}. The image is real and inverted, ${m>1.001?'magnified':m<.999?'diminished':'the same size'}.`]}]
}).forEach(([k,v])=>E[k].push(...v));
$('es').innerHTML=`<div class="card"><h2>Build an essay set</h2><b>Chapters</b><div class="chips" id="ec" style="margin:6px 0"></div><button class="chip" id="eall">Select all</button><label for="et">Question type</label><select id="et"><option value="0">Mixed (text + diagrams)</option><option value="1">Diagram questions only</option><option value="2">Text questions only</option></select><label for="en">Number of essay questions</label><select id="en"><option>3</option><option>5</option><option selected>10</option><option>15</option><option>20</option><option>30</option><option>40</option></select><p><button class="btn" id="ego">Generate essay questions</button></p></div><div id="eq"></div>`;
$('ec').innerHTML=T.map(t=>`<button class="chip" data-t="${t[0]}" aria-pressed="true">${t[1]}</button>`).join('');
$('ec').onclick=e=>{if(e.target.dataset.t)e.target.setAttribute('aria-pressed',e.target.getAttribute('aria-pressed')!='true')};
$('eall').onclick=()=>document.querySelectorAll('#ec .chip').forEach(c=>c.setAttribute('aria-pressed','true'));
function eg(){const tops=[...document.querySelectorAll('#ec .chip[aria-pressed=true]')].map(c=>c.dataset.t);if(!tops.length)return alert('Select at least one chapter.');
 const n=+$('en').value,ty=+$('et').value,all=tops.flatMap(t=>E[t].map(x=>{const y=typeof x=='function'?x():x;return{t,q:y[0],a:y[1],g:y[2]}})),w1=sh(all.filter(x=>x.g)),w2=sh(all.filter(x=>!x.g)),d1=w1.slice(0,Math.ceil(n/3));
 let pk=ty==1?w1.slice(0,n):ty==2?w2.slice(0,n):d1.concat(w2.slice(0,n-d1.length));if(ty==0&&pk.length<n)pk=pk.concat(w1.slice(d1.length,d1.length+n-pk.length));pk=sh(pk);
 $('eq').innerHTML=`<p class="meta">${pk.length} question${pk.length==1?'':'s'}${pk.length<n?' (all that are available for this selection)':''}</p>`+pk.map((x,i)=>`<div class="card"><div class="meta">Q${i+1} | ${TN[x.t]}${x.g?' | Diagram':''}</div><b>${x.q}</b>${qd(x.g)}<textarea class="ta" placeholder="Write your answer here, then check the model answer…" aria-label="Your answer"></textarea><details><summary>Show model answer</summary><div class="fb g">${x.a}</div></details></div>`).join('')+'<p><button class="btn alt" onclick="eg()">Generate a new set</button></p>';$('eq').scrollIntoView({behavior:'smooth'})}
$('ego').onclick=eg;
/* ---------- nav, revise ---------- */
function show(v){document.querySelectorAll('main>section').forEach(s=>s.hidden=s.id!=v);document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.v==v));if(v=='report')rep();scrollTo(0,0)}
document.querySelector('nav').onclick=e=>{if(e.target.dataset.v)show(e.target.dataset.v)};
$('chips').innerHTML=T.map(t=>`<button class="chip" data-t="${t[0]}" aria-pressed="false">${t[1]}</button>`).join('');
function lesson(id){const t=T.find(x=>x[0]==id);document.querySelectorAll('#chips .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.t==id));
 $('les').innerHTML=`<div class="card"><h2>${t[1]}</h2><div class="grid"><div>${dg(t[2])}</div><div><b>Key formulas</b>${t[4].map(f=>`<div class="f">${f}</div>`).join('')}</div></div><h3>Remember</h3><ul>${t[3].map(p=>`<li>${p}</li>`).join('')}</ul>${xt(id)}<button class="btn" id="lp">Practice this lesson</button></div>`;
 $('lp').onclick=()=>{startQ('practice',gen([id],0,10));show('pr')};$('les').scrollIntoView({behavior:'smooth'})}
$('chips').onclick=e=>{if(e.target.dataset.t)lesson(e.target.dataset.t)};
/* ---------- practice setup ---------- */
$('ptop').innerHTML=T.map(t=>`<button class="chip" data-t="${t[0]}" aria-pressed="true">${t[1]}</button>`).join('');
$('ptop').onclick=e=>{if(e.target.dataset.t)e.target.setAttribute('aria-pressed',e.target.getAttribute('aria-pressed')!='true')};
$('all').onclick=()=>document.querySelectorAll('#ptop .chip').forEach(c=>c.setAttribute('aria-pressed','true'));
$('go').onclick=()=>{const tops=[...document.querySelectorAll('#ptop .chip[aria-pressed=true]')].map(c=>c.dataset.t);if(!tops.length)return alert('Select at least one topic.');const qs=gen(tops,+$('dif').value,+$('cnt').value,+$('dq').value);if(!qs.length)return alert('No questions match this selection.');startQ('practice',qs)};
$('goex').onclick=()=>{let qs=[];T.forEach(t=>qs=qs.concat(gen([t[0]],0,2)));startQ('exam',sh(qs))};
/* ---------- quiz engine ---------- */
let Z;
function startQ(mode,qs){const box=mode=='exam'?'exq':'prq';Z={mode,qs,i:0,res:[],box,end:Date.now()+33*60000};$(mode=='exam'?'exset':'prset').hidden=true;if(mode=='exam')show('ex');
 clearInterval(Z.tm);if(mode=='exam')Z.tm=setInterval(()=>{const l=Math.max(0,Z.end-Date.now()),e=$('tm');if(e)e.textContent=Math.floor(l/60000)+':'+String(Math.floor(l/1000)%60).padStart(2,'0');if(!l)fin()},1000);rq()}
function rq(){const q=Z.qs[Z.i];Z.t0=Date.now();Z.ans=0;$(Z.box).innerHTML=`<div class="card"><div class="meta">Question ${Z.i+1} of ${Z.qs.length} | ${TN[q.t]} | ${['','Easy','Medium','Hard'][q.d]}${Z.mode=='exam'?' | Time left <b id="tm"></b>':''}</div><div class="bar" style="margin:8px 0"><i style="width:${Z.i/Z.qs.length*100}%"></i></div><h2>${q.q}</h2>${qd(q.g)}<div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${o.s}</button>`).join('')}</div><div id="fb"></div></div>`}
function nextBtn(){const last=Z.i==Z.qs.length-1;return `<button class="btn" id="nx">${last?'Finish':'Next question'}</button>`}
document.addEventListener('click',e=>{const b=e.target.closest('.opt'),n=e.target.id=='nx';if(n){Z.i++;Z.i<Z.qs.length?rq():fin();return}
 if(!b||Z.ans)return;Z.ans=1;const q=Z.qs[Z.i],k=+b.dataset.k,o=q.o[k],c=q.o.find(x=>x.ok),s=Math.round((Date.now()-Z.t0)/1000);
 Z.res.push({g:q.g,t:q.t,d:q.d,ok:!!o.ok,s,q:q.q,y:o.s,c:c.s,e:q.e,r:o.r});
 const bs=[...document.querySelectorAll('.opt')];
 if(Z.mode=='practice'){bs.forEach((x,i)=>{if(q.o[i].ok)x.classList.add('ok')});if(!o.ok)b.classList.add('no');
  $('fb').innerHTML=o.ok?`<div class="fb g"><b>Correct.</b> ${q.e}</div>`:`<div class="fb r"><b>Not quite: ${o.s}</b><br>Why it is wrong: ${o.r}</div><div class="fb g"><b>Correct answer: ${c.s}</b><br>Why it is right: ${q.e}</div>`}
 else b.classList.add('sel');
 $('fb').innerHTML+=nextBtn()});
function fin(){clearInterval(Z.tm);if(!Z.res.length){$(Z.box).innerHTML='';$(Z.mode=='exam'?'exset':'prset').hidden=false;return}
 const ok=Z.res.filter(r=>r.ok).length,n=Z.res.length,tt=Z.res.reduce((a,r)=>a+r.s,0);
 H.push({m:Z.mode,ts:Date.now(),it:Z.res.map(r=>({g:r.g,t:r.t,d:r.d,ok:r.ok,s:r.s,q:r.q,y:r.y,c:r.c,e:r.e,r:r.r}))});save();
 $(Z.box).innerHTML=`<div class="card"><h2>${Z.mode=='exam'?'Exam':'Practice'} finished</h2><div class="big">${Math.round(ok/n*100)}%</div><p>${ok} of ${n} correct in ${Math.floor(tt/60)} min ${tt%60} s.</p><button class="btn" id="vr">See my report</button> <button class="btn alt" id="again">New ${Z.mode}</button></div>${Z.mode=='exam'?'<h3>Review</h3>'+Z.res.map((r,i)=>rv(r,i)).join(''):''}`;
 $('vr').onclick=()=>show('report');$('again').onclick=()=>{$(Z.box).innerHTML='';$(Z.mode=='exam'?'exset':'prset').hidden=false}}
const rv=(r,i)=>`<div class="card"><div class="meta">Q${i+1} | ${TN[r.t]}</div><b>${r.q}</b>${qd(r.g)}<div class="fb ${r.ok?'g':'r'}">${r.ok?'Correct: '+r.c:'Your answer: '+r.y+'<br>Why it is wrong: '+r.r}</div>${r.ok?'':`<div class="fb g">Correct answer: ${r.c}<br>Why: ${r.e}</div>`}</div>`;
/* ---------- report ---------- */
function rep(){const all=H.flatMap(h=>h.it);
 if(!all.length){$('report').innerHTML='<div class="card"><h2>No results yet</h2><p>Complete a practice set or the exam and your level, timing and study plan will appear here.</p><button class="btn" onclick="show(\'pr\')">Start practising</button></div>';return}
 const n=all.length,ok=all.filter(r=>r.ok).length,pc=Math.round(ok/n*100),avg=Math.round(all.reduce((a,r)=>a+r.s,0)/n);
 const lv=pc>=85?['Excellent','You master most of the syllabus. Keep sharp with timed mixed exams.']:pc>=70?['Proficient','Solid understanding. Close the gaps in the topics below.']:pc>=50?['Developing','You know the basics but lose marks on details. Revise the lessons below, then redo practice.']:['Needs support','Start with the lesson summaries and formulas, then practise easy questions before moving on.'];
 const tp=T.map(t=>{const a=all.filter(r=>r.t==t[0]);return{id:t[0],n:t[1],c:a.length,p:a.length?Math.round(a.filter(r=>r.ok).length/a.length*100):null,s:a.length?Math.round(a.reduce((x,r)=>x+r.s,0)/a.length):0}});
 const weak=tp.filter(t=>t.p!==null&&t.p<70).sort((a,b)=>a.p-b.p),untested=tp.filter(t=>t.p===null),ex=H.filter(h=>h.m=='exam').pop();
 const tm=avg>90?'You are slow (average '+avg+' s). Memorise the formulas and practise setting up before calculating.':avg<20&&pc<60?'You answer very quickly ('+avg+' s) but make mistakes. Slow down and read every option.':'Your pace ('+avg+' s per question) is fine.';
 const wr=all.filter(r=>!r.ok).slice(-15).reverse();
 $('report').innerHTML=`<div class="card"><h2>Your report</h2><div class="grid"><div><div class="big">${pc}%</div><b>Level: ${lv[0]}</b><p>${lv[1]}</p></div><div><p>Questions answered: <b>${n}</b> (${ok} correct)</p><p>Average time: <b>${avg} s</b> per question</p>${ex?`<p>Latest exam: <b>${Math.round(ex.it.filter(r=>r.ok).length/ex.it.length*100)}%</b></p>`:'<p>You have not taken the full exam yet.</p>'}<p>${tm}</p></div></div></div>
 <div class="card"><h3>Results by topic</h3><table><tr><th>Topic</th><th>Score</th><th>Avg time</th></tr>${tp.map(t=>`<tr><td>${t.n}</td><td style="min-width:120px">${t.p===null?'<span class="meta">not tried</span>':`${t.p}%<div class="bar"><i style="width:${t.p}%;background:${t.p<70?'var(--bad)':'var(--ok)'}"></i></div>`}</td><td>${t.c?t.s+' s':''}</td></tr>`).join('')}</table></div>
 <div class="card"><h3>What to do next</h3><ol>${weak.slice(0,4).map(t=>`<li>Revise <b>${t.n}</b> (${t.p}%): read the summary, then do 10 easy questions, then 10 medium.</li>`).join('')||'<li>No weak topics. Move on to hard questions and the full exam.</li>'}${untested.length?`<li>Not tried yet: ${untested.map(t=>t.n).join(', ')}.</li>`:''}<li>Repeat the full exam after revising; aim to improve by 10 points.</li></ol></div>
 ${wr.length?'<h3>Recent mistakes</h3>'+wr.map((r,i)=>rv(r,i)).join(''):''}
 <p class="noprint"><button class="btn" onclick="print()">Download PDF report</button> <button class="btn alt" id="rs">Reset my data</button></p><p class="meta noprint">In the print window choose “Save as PDF”.</p>`;
 $('rs').onclick=()=>{if(confirm('Delete all saved results?')){H=[];save();rep()}}}
</script></body></html>
